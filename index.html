<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>NEET - View Result</title>
  <style>
    :root{--navy:#06243f;--green:#1f8a4d;--muted:#6b7280;--bluecap:#071a58;--overlay-bg:rgba(20,20,20,0.95)}
    body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#fff;color:#0b1630}
    .top-strip{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;border-bottom:10px solid var(--navy)}
    .title-wrap{position:absolute;left:50%;transform:translateX(-50%);text-align:center}
    .title-wrap h2{margin:4px 0 0;font-size:18px;letter-spacing:0.5px}

    main{min-height:calc(100vh - 150px);display:flex;align-items:center;justify-content:center;padding:30px}

    .card{width:700px;max-width:95%;border:1px solid #e6e9ee;border-radius:2px;box-shadow:0 8px 30px rgba(2,6,23,0.06);overflow:hidden}
    .card-head{background:var(--navy);color:#fff;padding:14px 20px;font-weight:700;display:flex;align-items:center;gap:12px}
    .card-body{background:#fff;padding:26px}

    .form-row{display:flex;align-items:center;margin:12px 0}
    .form-row label{width:220px;color:#0b1630;font-weight:600}
    .form-row input{flex:1;padding:10px;border:1px solid #d1d5db;border-radius:3px;font-size:14px}

    .captcha-box{background:var(--bluecap);color:#fff;padding:10px 14px;border-radius:2px;font-weight:700;font-size:18px;letter-spacing:1px}

    footer{background:var(--navy);color:#fff;padding:14px 18px;text-align:center;font-size:13px}

    /* overlay viewer */
    .viewer-overlay{position:fixed;inset:0;display:none;flex-direction:column;background:var(--overlay-bg);z-index:99999}
    .viewer-toolbar{height:48px;background:#333;color:#fff;display:flex;align-items:center;gap:8px;padding:6px 10px}
    .viewer-toolbar .left, .viewer-toolbar .center, .viewer-toolbar .right{display:flex;align-items:center;gap:8px}
    .viewer-toolbar .left{flex:0}
    .viewer-toolbar .center{flex:1;justify-content:center}
    .viewer-toolbar .right{flex:0}

    .viewer-toolbar button{background:transparent;border:none;color:#fff;padding:6px 8px;border-radius:4px;cursor:pointer}
    .viewer-toolbar button:hover{background:rgba(255,255,255,0.06)}
    .viewer-toolbar .label{color:#ddd;font-weight:600}
    .zoom-display{min-width:56px;text-align:center}

    .viewer-stage{flex:1;display:flex;align-items:center;justify-content:center;overflow:auto;padding:18px}
    .viewer-stage .img-wrap{display:inline-block;position:relative}
    .viewer-stage img{display:block;max-width:none;max-height:none;transform-origin:center center}

    .icon{width:18px;height:18px;display:inline-block}
    .sep{width:1px;height:28px;background:rgba(255,255,255,0.08);margin:0 8px}

    @media (max-width:720px){.viewer-toolbar .center{display:none}}
  </style>
</head>
<body>
  <div class="top-strip">
    <div style="width:72px;height:48px;background:url('https://upload.wikimedia.org/wikipedia/commons/4/4f/Emblem_of_India.svg') center/contain no-repeat"></div>
    <div class="title-wrap">
      <h2>NATIONAL ELIGIBILITY CUM ENTRANCE TEST (UG) – 2026</h2>
      <p style="margin-top:6px;font-weight:600">Score Card</p>
    </div>
    <div style="width:120px;height:48px;background:url('https://upload.wikimedia.org/wikipedia/commons/2/22/National_Testing_Agency_logo.png') center/contain no-repeat"></div>
  </div>

  <main>
    <div class="card" role="main">
      <div class="card-head">🔒 View Result</div>
      <div class="card-body">
        <div class="form-row"><label for="appno">Application Number :</label><input id="appno" type="text" placeholder="Enter application number" autocomplete="off"></div>
        <div class="form-row"><label for="pwd">Password :</label><input id="pwd" type="password" placeholder="Enter password"></div>
        <div class="form-row"><label for="capInput">Enter CAPTCHA(<span style="color:green">case sensitive</span>) :</label><input id="capInput" type="text" placeholder="Type CAPTCHA exactly"></div>
        <div style="display:flex;align-items:center;justify-content:flex-start;margin-top:6px">
          <div style="width:220px;color:#0b1630;font-weight:600">CAPTCHA :</div>
          <div style="flex:1;display:flex;gap:12px;align-items:center">
            <div id="captchaCode" class="captcha-box">--</div>
            <button id="refreshBtn" title="Refresh CAPTCHA" aria-label="Refresh CAPTCHA" style="padding:8px;border-radius:6px;border:none;background:#eaf6ef;cursor:pointer">⟳</button>
          </div>
        </div>

        <div style="display:flex;align-items:center;justify-content:space-between;margin-top:18px">
          <div style="display:flex;gap:12px;align-items:center"><button id="loginBtn" style="background:var(--green);color:#fff;padding:10px 16px;border:none;border-radius:6px;cursor:pointer;font-weight:700">LOGIN</button></div>
          <div><a href="#" style="color:#09357c;text-decoration:underline;font-weight:600">Forgot Password ?</a></div>
        </div>

        <div id="message" style="margin-top:10px;color:#b91c1c;font-weight:700" aria-live="polite"></div>
      </div>
    </div>
  </main>

  <footer>This site is designed and hosted by NIC. The contents are provided by NTA. For any further information, please contact NTA.</footer>

  <!-- Viewer overlay (hidden until login) -->
  <div id="viewer" class="viewer-overlay" role="dialog" aria-hidden="true">
    <div class="viewer-toolbar">
      <div class="left">
        <button id="vb-close" title="Close viewer">✕</button>
        <div class="sep"></div>
        <button id="vb-prev" title="Previous page" disabled>◀</button>
        <button id="vb-next" title="Next page" disabled>▶</button>
        <div class="sep"></div>
        <div class="label" id="pageLabel">1 / 1</div>
      </div>

      <div class="center">
        <button id="vb-zoom-out" title="Zoom out">−</button>
        <div class="zoom-display" id="zoomDisplay">100%</div>
        <button id="vb-zoom-in" title="Zoom in">+</button>
        <div class="sep"></div>
        <button id="vb-fit-width" title="Fit width">Fit width</button>
        <button id="vb-fit-screen" title="Fit screen">Fit screen</button>
        <button id="vb-actual" title="Actual size">Actual size</button>
      </div>

      <div class="right">
        <button id="vb-rotate" title="Rotate">⤾</button>
        <div class="sep"></div>
        <a id="vb-download" href="sample.jpg" download target="_blank" style="color:#fff;text-decoration:none"><button title="Download">↓</button></a>
        <button id="vb-print" title="Print">🖨</button>
      </div>
    </div>

    <div class="viewer-stage" id="viewerStage">
      <div class="img-wrap"><img id="viewerImg" src="sample.jpg" alt="scorecard"></div>
    </div>
  </div>

<script>
  // Demo credentials
  const DEMO_USERS = {"260410764040":"Ssas@#9334"};

  // CAPTCHA generator
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';
  function rand(n){ return chars.charAt(Math.floor(Math.random()*chars.length)); }
  function genCaptcha(len=7){ let s=''; for(let i=0;i<len;i++) s+=rand(); return s; }

  let currentCaptcha = '';
  function setCaptcha(){ currentCaptcha = genCaptcha(7); document.getElementById('captchaCode').textContent = currentCaptcha; document.getElementById('capInput').value = ''; document.getElementById('message').textContent = ''; }
  document.getElementById('refreshBtn').addEventListener('click', setCaptcha);
  setCaptcha();

  // Viewer elements
  const viewer = document.getElementById('viewer');
  const viewerImg = document.getElementById('viewerImg');
  const zoomDisplay = document.getElementById('zoomDisplay');

  // viewer state
  let scale = 1; // 1 = 100%
  let rotation = 0; // degrees

  function updateZoomDisplay(){ zoomDisplay.textContent = Math.round(scale*100) + '%'; }
  function applyTransforms(){ viewerImg.style.transform = `scale(${scale}) rotate(${rotation}deg)`; }

  // REQUESTED starting zoom (175%)
  const REQUESTED_START_SCALE = 1.75;

  // show viewer and apply default fit/scale
  function showViewer(){
    viewer.style.display = 'flex'; viewer.setAttribute('aria-hidden','false');
    rotation = 0; scale = 1; viewerImg.style.transform = 'none';
    if(viewerImg.complete){ applyDefaultFit(); }
    else { viewerImg.onload = () => applyDefaultFit(); }
  }

  // apply default fit but start at requested 175% when safe; never upscale beyond intrinsic size
  function applyDefaultFit(){
    const iw = viewerImg.naturalWidth; const ih = viewerImg.naturalHeight;
    const vw = Math.max(100, window.innerWidth - 40);
    const vh = Math.max(100, window.innerHeight - 100);
    if(!iw || !ih){ scale = Math.min(1, REQUESTED_START_SCALE); rotation = 0; applyTransforms(); updateZoomDisplay(); return; }

    // Start with requested scale
    let s = REQUESTED_START_SCALE;

    // Do not upscale beyond intrinsic size: cap s to 1 (intrinsic) if requested >1 and image intrinsic is small
    if(iw * s > iw){ s = Math.min(s, 1); }

    // If scaled width/height exceed viewport, scale down to fit
    if(iw * s > vw) s = vw / iw;
    if(ih * s > vh) s = Math.min(s, vh / ih);

    s = Math.max(0.05, s);
    scale = s; rotation = 0; applyTransforms(); updateZoomDisplay();
  }

  // Zoom controls
  function zoomIn(){ scale = Math.min(scale * 1.25, 5); applyTransforms(); updateZoomDisplay(); }
  function zoomOut(){ scale = Math.max(scale / 1.25, 0.1); applyTransforms(); updateZoomDisplay(); }
  function fitWidth(){ const vw = window.innerWidth - 40; const iw = viewerImg.naturalWidth; if(iw){ scale = iw > vw ? vw/iw : 1; applyTransforms(); updateZoomDisplay(); } }
  function fitScreen(){ const vw = window.innerWidth - 40; const vh = window.innerHeight - 100; const iw = viewerImg.naturalWidth; const ih = viewerImg.naturalHeight; if(!iw) return; const sx = vw/iw; const sy = vh/ih; scale = Math.min(1, Math.min(sx, sy)); applyTransforms(); updateZoomDisplay(); }
  function actualSize(){ const iw = viewerImg.naturalWidth; if(!iw) return; scale = 1; if(viewerImg.naturalHeight > (window.innerHeight - 100)){ scale = (window.innerHeight - 100) / viewerImg.naturalHeight; } applyTransforms(); updateZoomDisplay(); }

  document.getElementById('vb-zoom-in').addEventListener('click', zoomIn);
  document.getElementById('vb-zoom-out').addEventListener('click', zoomOut);
  document.getElementById('vb-fit-width').addEventListener('click', fitWidth);
  document.getElementById('vb-fit-screen').addEventListener('click', fitScreen);
  document.getElementById('vb-actual').addEventListener('click', actualSize);

  document.getElementById('vb-close').addEventListener('click', ()=>{ viewer.style.display='none'; viewer.setAttribute('aria-hidden','true'); document.body.style.overflow=''; });
  document.getElementById('vb-print').addEventListener('click', ()=>{ const w = window.open(); const imgHtml = `<img src="${viewerImg.src}" style="max-width:100%;height:auto">`; w.document.write('<html><head><title>Print</title></head><body style="margin:0;padding:10px;background:#fff">'+imgHtml+'</body></html>'); w.document.close(); w.focus(); w.print(); });

  document.getElementById('vb-rotate').addEventListener('click', ()=>{ rotation = (rotation + 90) % 360; applyTransforms(); });

  document.addEventListener('keydown', (e)=>{
    if(viewer.style.display !== 'flex') return;
    if(e.key === '+') zoomIn();
    if(e.key === '-') zoomOut();
    if(e.key === 'Escape') { viewer.style.display='none'; viewer.setAttribute('aria-hidden','true'); document.body.style.overflow=''; }
  });

  // Login flow
  document.getElementById('loginBtn').addEventListener('click', ()=>{
    const app = document.getElementById('appno').value.trim();
    const pwd = document.getElementById('pwd').value;
    const ent = document.getElementById('capInput').value.trim();
    const msg = document.getElementById('message'); msg.style.color='#b91c1c';
    if(!app || !pwd || !ent){ msg.textContent='Please fill all fields.'; return; }
    if(ent !== currentCaptcha){ msg.textContent='CAPTCHA incorrect. Click refresh and try again.'; setCaptcha(); return; }
    const expected = DEMO_USERS[app];
    if(!expected || expected !== pwd){ msg.textContent='Invalid application number or password.'; setCaptcha(); return; }
    msg.style.color='green'; msg.textContent='Login successful — opening score card.';
    document.body.style.overflow='hidden';
    showViewer();
  });

  window.addEventListener('resize', ()=>{ if(viewer.style.display === 'flex') applyDefaultFit(); });
</script>
</body>
</html>
